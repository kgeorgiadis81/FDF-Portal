<div class="auth-layout">
  <div class="auth-brand">
    <img
      class="auth-brand__logo"
      src="/images/portal-logo.webp"
      alt="FDF logo"
      width="260"
      height="197"
    />
    <div class="auth-brand__text">
      <span class="auth-brand__name">FDF Portal</span>
      <span class="auth-brand__tagline">Your FDF Journey, Organized.</span>
    </div>
  </div>

  <div class="auth-card">
    <router-outlet />
  </div>

  <footer class="auth-footer">
    <p>© 2026 FDF Management ·
      @if (portalConfig.privacyPolicyUrl()) {
        <a [href]="portalConfig.privacyPolicyUrl()" target="_blank" rel="noopener noreferrer">Privacy</a>
      } @else {
        Privacy
      }
    </p>
  </footer>
</div>
