<div class="shell">
  <!-- Top Navigation Bar -->
  <mat-toolbar class="shell__nav">
    <div class="shell__nav-inner">
      <!-- Brand -->
      <a routerLink="/dashboard" class="shell__brand">
        <span class="fdf-logo-mark">
          <img
            src="/images/portal-logo.webp"
            alt="FDF logo"
            width="92"
            height="70"
          />
        </span>
        <span class="shell__brand-name">FDF Portal</span>
      </a>

      <!-- Desktop Nav Links -->
      <nav class="shell__links hide-mobile">
        <a routerLink="/dashboard" routerLinkActive="active" class="shell__link">My Groups</a>
        <a routerLink="/profile"   routerLinkActive="active" class="shell__link">Profile</a>
      </nav>

      <!-- Account Menu -->
      <button mat-icon-button [matMenuTriggerFor]="accountMenu" aria-label="Account menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #accountMenu="matMenu">
        <div class="shell__menu-header">
          <span class="shell__menu-name">{{ name() }}</span>
        </div>
        <mat-divider />
        <a mat-menu-item routerLink="/dashboard"><mat-icon>home</mat-icon> My Groups</a>
        <a mat-menu-item routerLink="/profile"><mat-icon>person</mat-icon> Profile</a>
        <mat-divider />
        <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Sign out</button>
      </mat-menu>
    </div>
  </mat-toolbar>

  <!-- Page content -->
  <main class="shell__content">
    <router-outlet />
  </main>
</div>
