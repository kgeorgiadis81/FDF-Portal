name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-portal
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          REQUIRE_GOOGLE_CLIENT_ID: "false"
        run: npm run build:prod

  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Require deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$VPS_HOST" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ] && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ] && missing+=("VPS_SSH_KEY")
          [ -z "$VPS_KNOWN_HOSTS" ] && missing+=("VPS_KNOWN_HOSTS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Deploy cannot run: missing required repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions (names only; values are never printed)."
            exit 1
          fi
          if ! printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' | grep -Eq '(^| )(ssh-ed25519|ssh-rsa|ecdsa-sha2-) '; then
            echo "::error::VPS_KNOWN_HOSTS must be one or more OpenSSH known_hosts lines (ssh-ed25519, ssh-rsa, or ecdsa). A bare SHA256 fingerprint is not accepted. The secret value was not printed."
            exit 1
          fi
          echo "Required deployment secrets are present."

  verify-merged-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resp=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          merged_count=$(echo "$resp" | jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged_count" -eq 0 ]; then
            echo "::error::Commit ${GITHUB_SHA} has no merged pull request. Do not push directly to main; open a PR and merge it instead."
            exit 1
          fi
          echo "Merged-PR guard passed for ${GITHUB_SHA}."

  deploy:
    needs: [test, verify-secrets, verify-merged-pr]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.verify-secrets.result == 'success' &&
      (needs.verify-merged-pr.result == 'success' || needs.verify-merged-pr.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          REQUIRE_GOOGLE_CLIENT_ID: "false"
        run: npm run build:prod
      - name: Write release marker
        run: node scripts/write-release-marker.js
      - name: Configure SSH from the pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          portal_install_ssh_files
      - name: Verify pinned host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          # Host-key check runs before any upload. A wrong VPS_KNOWN_HOSTS fails here.
          portal_ssh "${VPS_USER}@${VPS_HOST}" "true"
      - name: Create the release directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          sha="${{ github.sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to deploy: github.sha is not a 40-character hex commit."
            exit 1
          fi
          portal_ssh "${VPS_USER}@${VPS_HOST}" "mkdir -p -- /var/www/fdf/portal/releases/${sha}"
      - name: Rsync the release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          sha="${{ github.sha }}"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to deploy: github.sha is not a 40-character hex commit."
            exit 1
          fi
          rsync -az --delete \
            -e "$(portal_ssh_rsh)" \
            dist/fdf-portal/browser/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/fdf/portal/releases/${sha}/"
      - name: Switch current to the new release
        id: activate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          sha="${{ github.sha }}"
          raw=$(portal_ssh "${VPS_USER}@${VPS_HOST}" \
            "PORTAL_ROOT=/var/www/fdf/portal bash -s -- activate ${sha}" \
            < scripts/portal-release.sh)
          prev=$(printf '%s\n' "$raw" | awk '/^FDF_PREVIOUS /{print $2}' | tail -n 1)
          if [[ "$prev" != "none" && ! "$prev" =~ ^/var/www/fdf/portal/releases/[0-9a-f]{40}$ ]]; then
            echo "::error::Activate returned an unexpected previous release. current may already point at the new release; inspect it before retrying."
            exit 1
          fi
          echo "previous=${prev}" >> "$GITHUB_OUTPUT"
          echo "current -> releases/${sha} (previous: ${prev})"
      - name: Smoke check release marker
        id: smoke
        run: bash scripts/smoke-portal-release.sh "https://portal.yourfdf.com" "${{ github.sha }}" dist/fdf-portal/browser/version.json
      - name: Roll back current after a failed smoke check
        if: steps.smoke.outcome == 'failure'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          prev="${{ steps.activate.outputs.previous }}"
          if [[ "$prev" != "none" && ! "$prev" =~ ^/var/www/fdf/portal/releases/[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot roll back: previous release path is invalid. current may still point at the failed release."
            exit 1
          fi
          portal_ssh "${VPS_USER}@${VPS_HOST}" \
            "PORTAL_ROOT=/var/www/fdf/portal bash -s -- rollback ${prev}" \
            < scripts/portal-release.sh
          # The smoke step already failed, so this job stays red after current is restored.
          echo "::error::Smoke check failed. current was switched back to ${prev}."
      - name: Keep the newest releases
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/portal-ssh.sh
          source scripts/portal-ssh.sh
          portal_ssh "${VPS_USER}@${VPS_HOST}" \
            "PORTAL_ROOT=/var/www/fdf/portal bash -s -- prune 5" \
            < scripts/portal-release.sh
