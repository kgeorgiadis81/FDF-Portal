name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-portal
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          REQUIRE_GOOGLE_CLIENT_ID: "true"
        run: npm run build:prod
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync Director Portal static files
        run: |
          rsync -az --delete \
            dist/fdf-portal/browser/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/fdf/portal/"
      - name: Smoke
        run: curl -fsS -o /dev/null https://portal.yourfdf.com/
