name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-portal
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          REQUIRE_GOOGLE_CLIENT_ID: "false"
        run: npm run build:prod

  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Require deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$VPS_HOST" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ] && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ] && missing+=("VPS_SSH_KEY")
          [ -z "$VPS_KNOWN_HOSTS" ] && missing+=("VPS_KNOWN_HOSTS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Deploy cannot run: missing required repository secrets: ${missing[*]}. Add them under Settings → Secrets and variables → Actions (names only; values are never printed)."
            exit 1
          fi
          echo "Required deployment secrets are present."

  verify-merged-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resp=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          merged_count=$(echo "$resp" | jq '[.[] | select(.merged_at != null)] | length')
          if [ "$merged_count" -eq 0 ]; then
            echo "::error::Commit ${GITHUB_SHA} has no merged pull request. Do not push directly to main; open a PR and merge it instead."
            exit 1
          fi
          echo "Merged-PR guard passed for ${GITHUB_SHA}."

  deploy:
    needs: [test, verify-secrets, verify-merged-pr]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.test.result == 'success' &&
      needs.verify-secrets.result == 'success' &&
      (needs.verify-merged-pr.result == 'success' || needs.verify-merged-pr.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          REQUIRE_GOOGLE_CLIENT_ID: "false"
        run: npm run build:prod
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Rsync Director Portal static files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete \
            dist/fdf-portal/browser/ \
            "${VPS_USER}@${VPS_HOST}:/var/www/fdf/portal/"
      - name: Smoke
        run: curl -fsS -o /dev/null https://portal.yourfdf.com/
