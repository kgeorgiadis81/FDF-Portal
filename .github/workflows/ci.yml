name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  # upload-artifact needs this once the workflow sets an explicit permissions block.
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:prod
      - name: Release marker matches the production bundle
        env:
          RELEASE_COMMIT: "0123456789abcdef0123456789abcdef01234567"
        run: node scripts/write-release-marker.js
      - name: Install OpenSSH for the host-key deploy test
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openssh-server rsync
      - name: Portal release deploy tests
        run: bash scripts/portal-release.test.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chrome for Karma
        run: |
          curl -fsSL -o /tmp/google-chrome-stable.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            /tmp/google-chrome-stable.deb
      - name: Unit tests with coverage
        run: npm run test:ci
      - name: Write coverage table
        if: always()
        run: node scripts/coverage-step-summary.js
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/fdf-portal
          if-no-files-found: warn
          retention-days: 14

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # actions/checkout rejects paths outside $GITHUB_WORKSPACE, so the
      # backend is checked out inside the workspace and moved next to the app.
      # Playwright and the e2e scripts resolve the sibling as ../FDF_Backend.
      - name: Check out FDF_Backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kgeorgiadis81/FDF_Backend
          ref: main
          path: .ci-backend
          token: ${{ secrets.FDF_BACKEND_CHECKOUT_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Place FDF_Backend next to the portal
        run: mv .ci-backend ../FDF_Backend
      - name: Install backend dependencies
        working-directory: ../FDF_Backend
        run: npm ci
      - name: Prepare backend e2e env
        working-directory: ../FDF_Backend
        run: |
          cp .env.e2e.example .env.e2e
          if grep -q '^BREVO_SENDER_NAME=FDF E2E$' .env.e2e; then
            sed -i 's/^BREVO_SENDER_NAME=FDF E2E$/BREVO_SENDER_NAME="FDF E2E"/' .env.e2e
          fi
      - name: Use committed e2e seed logins
        run: cp e2e/.env.test.example e2e/.env.test
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Seed MariaDB via backend e2e:setup
        run: |
          bash .cursor/ensure-docker.sh
          (cd ../FDF_Backend && npm run e2e:setup)
          touch /tmp/fdf-e2e-ready
      - name: Start backend and portal
        run: |
          bash .cursor/start-api-e2e.sh > /tmp/api-e2e.log 2>&1 &
          bash .cursor/start-portal-e2e.sh > /tmp/portal-e2e.log 2>&1 &
          if ! bash .cursor/wait-for-http.sh http://localhost:3501/health "FDF_Backend"; then
            echo '--- api log ---'
            cat /tmp/api-e2e.log || true
            exit 1
          fi
          if ! bash .cursor/wait-for-http.sh http://localhost:4201 "Portal" 120; then
            echo '--- portal log ---'
            cat /tmp/portal-e2e.log || true
            exit 1
          fi
      - name: Playwright portal-chromium
        env:
          CI: 'true'
        run: npx playwright test --project=portal-chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/reports/html
          if-no-files-found: warn
          retention-days: 14
