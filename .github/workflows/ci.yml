name: CI

env:
  NG_CLI_ANALYTICS: "false"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration=production

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        with:
          chrome-version: stable
      - run: npm ci
      - run: npm run test:ci
      - name: Publish coverage summary
        if: always()
        run: node scripts/print-coverage-summary.js coverage/fdf-portal/coverage-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: FDF-Portal
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kgeorgiadis81/FDF_Backend
          ref: main
          token: ${{ secrets.FDF_BACKEND_CHECKOUT_TOKEN }}
          path: FDF_Backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            FDF-Portal/package-lock.json
            FDF_Backend/package-lock.json
      - run: npm ci
        working-directory: FDF_Backend
      - run: npm ci
        working-directory: FDF-Portal
      - name: Write E2E env from GitHub secrets
        working-directory: FDF-Portal
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_GLOBAL_ADMIN_USERNAME: ${{ secrets.E2E_GLOBAL_ADMIN_USERNAME }}
          E2E_REG_ADMIN_USERNAME: ${{ secrets.E2E_REG_ADMIN_USERNAME }}
          E2E_COMP_ADMIN_USERNAME: ${{ secrets.E2E_COMP_ADMIN_USERNAME }}
          E2E_JUDGE_ADMIN_USERNAME: ${{ secrets.E2E_JUDGE_ADMIN_USERNAME }}
          E2E_JUDGE_USERNAME: ${{ secrets.E2E_JUDGE_USERNAME }}
          E2E_VIEWER_USERNAME: ${{ secrets.E2E_VIEWER_USERNAME }}
        run: node scripts/write-e2e-env.js
      - name: Seed MariaDB
        working-directory: FDF_Backend
        run: npm run e2e:setup
      - name: Start API and app
        working-directory: FDF-Portal
        run: |
          npm --prefix ../FDF_Backend run start:e2e > /tmp/fdf-api.log 2>&1 &
          npm run start:e2e > /tmp/fdf-portal.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3501/health >/dev/null && curl -sf http://localhost:4201 >/dev/null && exit 0
            sleep 5
          done
          echo "Servers did not become ready" >&2
          tail -n 80 /tmp/fdf-api.log /tmp/fdf-portal.log >&2 || true
          exit 1
      - run: npx playwright install --with-deps chromium
        working-directory: FDF-Portal
      - name: Playwright desktop Chrome
        working-directory: FDF-Portal
        run: npx playwright test --project=portal-chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: FDF-Portal/e2e/reports/html
          if-no-files-found: warn
